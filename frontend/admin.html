<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Админ - CRM</title>
  <link rel="preconnect" href="https://api.fontshare.com">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
  <div class="shell">
    <header class="top">
      <div><h1 class="title">Администрирование</h1><div class="sub">Настройки системы, пользователи, аудит-лог.</div></div>
      <div class="actions">
        <button class="btn btn-secondary" onclick="window.location.href='/'">← На главную</button>
      </div>
    </header>

    <section class="stats" style="margin-top:16px">
      <div class="card stat"><small class="muted">Пользователей</small><b id="statUsers">0</b></div>
      <div class="card stat"><small class="muted">Заявок</small><b id="statRequests">0</b></div>
      <div class="card stat"><small class="muted">Завершено</small><b id="statDone">0</b></div>
      <div class="card stat"><small class="muted">Выручка</small><b id="statRevenue">0 ₽</b></div>
    </section>

    <div class="card" style="margin-top:16px">
      <h2 style="margin:0 0 12px">Пользователи</h2>
      <div id="usersList" class="admin-users"></div>
    </div>

    <div class="card" style="margin-top:16px">
      <h2 style="margin:0 0 12px">Аудит-лог</h2>
      <div id="auditList" class="list"></div>
    </div>
  </div>

  <script type="module">
    import { api } from '/static/js/api.js';
    import { $, esc, money, dt } from '/static/js/utils.js';

    async function load() {
      try {
        const users = await api('/api/users');
        $('statUsers').textContent = users.length;
        $('usersList').innerHTML = users.map(u => `<div class="user"><div><b>${esc(u.name)}</b><br><small>${esc(u.id)} · ${u.role}</small></div></div>`).join('');

        const requests = await api('/api/requests');
        $('statRequests').textContent = requests.length;
        $('statDone').textContent = requests.filter(r => r.status === 'done').length;
        $('statRevenue').textContent = money(requests.filter(r => r.status === 'done').reduce((a, r) => a + Number(r.price || 0), 0));

        const audit = await api('/api/admin/audit');
        $('auditList').innerHTML = audit.slice(0, 20).map(l => `<div class="request"><div class="row"><div><div class="name">${esc(l.user_name || l.user_id)}</div><div class="muted">${dt(l.created_at)}</div></div><span class="badge" style="background:var(--primary-soft)">${esc(l.action)}</span></div><div class="meta"><div><b>Сущность:</b> ${esc(l.entity_type)} ${l.entity_id ? `#${l.entity_id}` : ''}</div></div></div>`).join('');
      } catch (e) {
        alert('Ошибка: ' + e.message);
      }
    }

    load();
  </script>
</body>
</html>
