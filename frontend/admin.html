<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ-панель | CRM</title>
  <link rel="preconnect" href="https://api.fontshare.com">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">
  <style>
    :root, [data-theme="light"] { --bg:#f7f6f2; --surface:#fbfbf9; --surface2:#f3f0ec; --border:#d4d1ca; --text:#28251d; --muted:#706d67; --inverse:#f9f8f4; --primary:#01696f; --primary-hover:#0c4e54; --primary-soft:#d7e3df; --success:#437a22; --warning:#a86000; --danger:#a13544; --blue:#006494; --purple:#7a39bb; --radius:14px; --radius-sm:9px; --shadow:0 6px 20px rgba(40,37,29,.08); }
    [data-theme="dark"] { --bg:#171614; --surface:#1c1b19; --surface2:#272421; --border:#393836; --text:#eceae5; --muted:#b2aea8; --inverse:#141311; --primary:#4f98a3; --primary-hover:#227f8b; --primary-soft:#2b3938; --success:#6daa45; --warning:#edb336; --danger:#dd6974; --blue:#5591c7; --purple:#a86fdf; --shadow:0 8px 28px rgba(0,0,0,.3); }
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 'General Sans',Arial,sans-serif} button,input,textarea,select{font:inherit;color:inherit} button{cursor:pointer} input,textarea,select{width:100%;min-height:44px;padding:10px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);font-size:15px}
    .hidden{display:none!important}.shell{max-width:1000px;margin:auto;padding:16px 16px 80px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap}.title{margin:0;font:800 28px/1.1 'Satoshi',Arial,sans-serif}.sub{color:var(--muted)}.actions{display:flex;gap:8px}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}.btn{min-height:42px;padding:8px 14px;border:1px solid transparent;border-radius:var(--radius-sm);font-weight:700;background:transparent}.btn-primary{background:var(--primary);color:var(--inverse)}.btn-primary:hover{background:var(--primary-hover)}.btn-secondary{border-color:var(--border);background:var(--surface)}.btn-danger{border-color:color-mix(in srgb,var(--danger) 38%,transparent);color:var(--danger)}.btn-sm{min-height:34px;padding:4px 10px;font-size:14px}
    .user{padding:14px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:10px;background:var(--surface)}.user-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.user-head b{font-size:17px}.user-meta{color:var(--muted);font-size:14px;margin-bottom:10px}.permissions{display:grid;gap:8px;margin:12px 0}.perm-item{display:flex;gap:8px;align-items:center}.perm-item input{width:20px;min-height:20px}.user-actions{display:flex;gap:6px;margin-top:12px}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.38);display:none;align-items:center;justify-content:center;z-index:100}.modal.open{display:flex}.sheet{width:min(100%,500px);background:var(--bg);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}.sheet h3{margin:0 0 16px}.field{margin-bottom:14px}.field label{display:block;margin-bottom:6px;font-weight:700;font-size:14px}
    .empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:var(--radius)}
    .perm-item.disabled{opacity:0.5}.perm-item.disabled input{cursor:not-allowed}
  </style>
  <script>
    // Тема — до загрузки страницы
    (function(){const saved=localStorage.getItem('master_crm_theme');if(saved){document.documentElement.dataset.theme=saved;return}document.documentElement.dataset.theme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';})();
  </script>
</head>
<body>
  <div class="shell">
    <header class="top">
      <div><h1 class="title">⚙️ Админ-панель</h1><div class="sub">Управление пользователями и правами.</div></div>
      <div class="actions">
        <button class="btn btn-secondary" onclick="window.location.href='/'">← На главную</button>
        <button class="btn btn-primary" onclick="openAddUser()">+ Пользователь</button>
      </div>
    </header>
    
    <div id="usersList"></div>
  </div>

  <!-- Модалка: Пользователь -->
  <div id="userModal" class="modal">
    <div class="sheet">
      <h3 id="userModalTitle">Пользователь</h3>
      <form id="userForm">
        <input type="hidden" id="userId">
        <div class="field"><label>Логин</label><input id="userLogin" required pattern="[A-Za-z0-9_]+"></div>
        <div class="field"><label>Имя</label><input id="userName" required></div>
        <div class="field"><label>Пароль</label><input id="userPassword" type="password" minlength="4"></div>
        <div class="field"><label>Роль</label><select id="userRole"><option value="user">Мастер</option><option value="manager">Менеджер</option><option value="admin">Администратор</option></select></div>
        <div style="display:flex;gap:10px">
          <button type="button" class="btn btn-secondary" onclick="closeModal('userModal')">Отмена</button>
          <button type="submit" class="btn btn-primary">Сохранить</button>
        </div>
      </form>
    </div>
  </div>

<script>
const $=id=>document.getElementById(id);
let users=[],currentUserId=null;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const roleLabels={user:'Мастер',manager:'Менеджер',admin:'Администратор'};

function getToken(){return localStorage.getItem('master_crm_token');}
function authHeaders(){const t=getToken();return t?{Authorization:'Bearer '+t}:{}}

async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...authHeaders()}});if(!r.ok)throw new Error(await r.text());return r.json()}

async function load(){try{users=await api('/api/users');render()}catch(e){alert('Ошибка: '+e.message)}}

function render(){const list=$('usersList');if(!users.length){list.innerHTML='<div class="empty">Пользователей нет</div>';return}list.innerHTML=users.map(u=>`<div class="user"><div class="user-head"><b>${esc(u.name)}</b><span class="badge">${roleLabels[u.role]||u.role}</span></div><div class="user-meta">${esc(u.id)} ${u.role==='manager'?'(Менеджер)':''}${u.role==='admin'?'(Администратор — все права по умолчанию)':''}</div>${u.role==='manager'?`<div class="permissions"><div class="perm-item"><input type="checkbox" id="perm_price_${u.id}" ${u.can_edit_price?'checked':''} onchange="updatePermissions('${u.id}')"><label for="perm_price_${u.id}">Редактировать прайс</label></div><div class="perm-item"><input type="checkbox" id="perm_req_${u.id}" ${u.can_edit_requests?'checked':''} onchange="updatePermissions('${u.id}')"><label for="perm_req_${u.id}">Редактировать заявки</label></div><div class="perm-item"><input type="checkbox" id="perm_del_${u.id}" ${u.can_delete_requests?'checked':''} onchange="updatePermissions('${u.id}')"><label for="perm_del_${u.id}">Удалять заявки</label></div></div>`:u.role==='admin'?`<div class="permissions"><div class="perm-item disabled"><input type="checkbox" checked disabled><label>Редактировать прайс (по умолчанию)</label></div><div class="perm-item disabled"><input type="checkbox" checked disabled><label>Редактировать заявки (по умолчанию)</label></div><div class="perm-item disabled"><input type="checkbox" checked disabled><label>Удалять заявки (по умолчанию)</label></div></div>`:''}<div class="user-actions"><button class="btn btn-sm btn-secondary" onclick="editUser('${esc(u.id)}')">✏️ Изменить</button><button class="btn btn-sm btn-danger" onclick="deleteUser('${esc(u.id)}')">🗑️ Удалить</button></div></div>`).join('')}

function openModal(id){$(id).classList.add('open')}function closeModal(id){$(id).classList.remove('open')}
function openAddUser(){$('userForm').reset();$('userId').value='';$('userPassword').required=true;$('userModalTitle').textContent='Новый пользователь';openModal('userModal')}
function editUser(id){const u=users.find(x=>x.id===id);if(!u)return;currentUserId=id;$('userLogin').value=u.id;$('userLogin').disabled=true;$('userName').value=u.name;$('userPassword').value='';$('userPassword').required=false;$('userRole').value=u.role;$('userModalTitle').textContent='Редактировать пользователя';openModal('userModal')}
async function saveUser(e){e.preventDefault();const payload={id:$('userLogin').value.trim(),name:$('userName').value.trim(),password:$('userPassword').value,role:$('userRole').value};try{const id=currentUserId||$('userId').value;await api(id?`/api/users/${id}`:'/api/users',{method:id?'PUT':'POST',body:JSON.stringify(payload)});closeModal('userModal');currentUserId=null;await load()}catch(e){alert('Ошибка: '+e.message)}}
async function deleteUser(id){if(!confirm(`Удалить пользователя ${id}?`))return;try{await api(`/api/users/${id}`,{method:'DELETE'});await load()}catch(e){alert('Ошибка: '+e.message)}}
async function updatePermissions(userId){const u=users.find(x=>x.id===userId);if(!u)return;const payload={can_edit_price:$(`perm_price_${userId}`).checked,can_edit_requests:$(`perm_req_${userId}`).checked,can_delete_requests:$(`perm_del_${userId}`).checked};try{await api(`/api/users/${userId}/permissions`,{method:'PUT',body:JSON.stringify(payload)})}catch(e){alert('Ошибка: '+e.message);load()}}
$('userForm').onsubmit=saveUser;document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)closeModal(m.id)}));load();
</script>
</body>
</html>
