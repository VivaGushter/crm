<script>
const S={auth:null,me:null,users:[],items:[],month:new Date(new Date().getFullYear(),new Date().getMonth(),1),selected:new Date().toISOString().slice(0,10),weekStart:null,view:'month'};
const $=id=>document.getElementById(id);
const statuses={new:'Новая',scheduled:'Назначена',work:'В работе',done:'Завершена',cancel:'Отменена'};
const sourceLabels={unknown:'Не указан',avito:'Авито',house_chats:'Домовые чаты'};
const contactMethodLabels={'' :'Не указано',avito:'Авито',phone:'Звонок',telegram:'Telegram',max:'Max'};
const roleLabels={user:'Мастер',manager:'Менеджер',admin:'Администратор'};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function authHeaders(){return S.auth?{Authorization:'Basic '+btoa(S.auth.user+':'+S.auth.pass)}:{}}
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...authHeaders(),...(opt.headers||{})}});if(r.status===401){logout(false);throw new Error('Нужно войти заново')}const body=await r.text();let data={};try{data=body?JSON.parse(body):{}}catch{data={detail:body}}if(!r.ok)throw new Error(data.detail||'Ошибка запроса');return data}
function dateKey(v){return String(v).slice(0,10)}
function money(v){return new Intl.NumberFormat('ru-RU').format(Number(v||0))+' ₽'}
function dt(v){return new Intl.DateTimeFormat('ru-RU',{dateStyle:'short',timeStyle:'short'}).format(new Date(v))}
function labelDate(v){return new Intl.DateTimeFormat('ru-RU',{weekday:'long',day:'numeric',month:'long'}).format(new Date(v+'T00:00:00'))}
async function setTheme(theme){document.documentElement.dataset.theme=theme;$('themeBtn').textContent=theme==='dark'?'☀️':'🌙';try{await api('/api/me/settings',{method:'PUT',body:JSON.stringify({theme})})}catch(e){}}
async function toggleTheme(){const now=document.documentElement.dataset.theme||'light';const next=now==='dark'?'light':'dark';await setTheme(next)}
function openModal(id){$(id).classList.add('open');document.body.style.overflow='hidden'}function closeModal(id){$(id).classList.remove('open');document.body.style.overflow=''}
function renderUsersOptions(){const opts=S.users.map(u=>`<option value="${esc(u.id)}">${esc(u.name)}</option>`).join('');$('assignee').innerHTML=opts;$('assigneeFilter').innerHTML='<option value="all">Все мастера</option>'+opts;}
function renderStats(){const today=new Date().toISOString().slice(0,10),done=S.items.filter(x=>x.status==='done');$('statTotal').textContent=S.items.length;$('statToday').textContent=S.items.filter(x=>dateKey(x.visit_date)===today).length;$('statScheduled').textContent=S.items.filter(x=>x.status==='scheduled').length;$('statDone').textContent=done.length;$('statRevenue').textContent=money(done.reduce((a,x)=>a+Number(x.price||0),0));}
function getWeekStart(d){const date=new Date(d),day=(date.getDay()+6)%7;date.setDate(date.getDate()-day);return date}
function renderCalendar(){const m=S.month,start=new Date(m.getFullYear(),m.getMonth(),1),weekday=(start.getDay()+6)%7,gridStart=new Date(start);gridStart.setDate(start.getDate()-weekday);const by={};S.items.forEach(x=>{const k=dateKey(x.visit_date);(by[k]??=[]).push(x)});$('monthLabel').textContent=new Intl.DateTimeFormat('ru-RU',{month:'long',year:'numeric'}).format(m);$('calendar').innerHTML='';for(let i=0;i<42;i++){const d=new Date(gridStart);d.setDate(gridStart.getDate()+i);const k=d.toISOString().slice(0,10),list=(by[k]||[]).sort((a,b)=>a.visit_date.localeCompare(b.visit_date));const statusCounts={new:0,scheduled:0,work:0,done:0,cancel:0};list.forEach(x=>{if(statuses[x.status])statusCounts[x.status]++});const b=document.createElement('button');b.type='button';b.className='day'+(d.getMonth()!==m.getMonth()?' other':'')+(list.length?' has':'')+(k===S.selected?' active':'');let dotsHtml='';if(statusCounts.new>0)dotsHtml+=`<span class="status-dot status-new" title="Новая: ${statusCounts.new}"></span>`;if(statusCounts.scheduled>0)dotsHtml+=`<span class="status-dot status-scheduled" title="Назначена: ${statusCounts.scheduled}"></span>`;if(statusCounts.work>0)dotsHtml+=`<span class="status-dot status-work" title="В работе: ${statusCounts.work}"></span>`;if(statusCounts.done>0)dotsHtml+=`<span class="status-dot status-done" title="Завершена: ${statusCounts.done}"></span>`;if(statusCounts.cancel>0)dotsHtml+=`<span class="status-dot status-cancel" title="Отменена: ${statusCounts.cancel}"></span>`;b.innerHTML=`<div class="dhead"><span>${d.getDate()}</span><span>${list.length||''}</span></div><div style="margin-top:6px">${dotsHtml}${list.slice(0,1).map(x=>`<div class="dot">${esc(x.client)}</div>`).join('')}</div>`;b.onclick=()=>{S.selected=k;$('dateFilter').value=k;renderCalendar();renderRequests();if(S.view!=='month')switchView('month')};$('calendar').appendChild(b)}}
function renderWeek(){const start=getWeekStart(S.selected),end=new Date(start);end.setDate(start.getDate()+7);$('weekLabel').textContent=`${start.getDate()}-${end.getDate()} ${new Intl.DateTimeFormat('ru-RU',{month:'long'}).format(start)}`;$('weekGrid').innerHTML='';const by={};S.items.forEach(x=>{(by[dateKey(x.visit_date)]??=[]).push(x)});for(let i=0;i<7;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=d.toISOString().slice(0,10),list=(by[k]||[]).sort((a,b)=>a.visit_date.localeCompare(b.visit_date)),today=dateKey(new Date())===k;const col=document.createElement('div');col.className='week-col';col.innerHTML=`<div class="week-head${today?' today':''}">${new Intl.DateTimeFormat('ru-RU',{weekday:'short',day:'numeric'}).format(d)}</div><div class="week-body">${list.map(x=>`<div class="week-card" onclick="editRequest(${x.id})"><b>${esc(x.client)}</b><small>${dt(x.visit_date)}</small><small>${esc(x.address)}</small><span class="badge s-${x.status}" style="margin-top:6px;display:inline-block">${statuses[x.status]}</span></div>`).join('')}</div>`;$('weekGrid').appendChild(col)}}
function renderDay(){const d=new Date(S.selected);$('dayLabel').textContent=labelDate(S.selected);const list=S.items.filter(x=>dateKey(x.visit_date)===S.selected).sort((a,b)=>a.visit_date.localeCompare(b.visit_date));$('dayList').innerHTML=list.length?list.map(x=>`<div class="day-card"><div class="top"><div><div class="time">${dt(x.visit_date)}</div><div class="client">${esc(x.client)}</div></div><span class="badge s-${x.status}">${statuses[x.status]}</span></div><div class="meta"><div>📍 ${esc(x.address)}</div><div>📞 <a href="tel:${esc(x.phone)}">${esc(x.phone)}</a></div><div>👤 ${esc(x.assignee_name||x.assignee)}</div><div>💰 ${money(x.price)}</div>${x.source&&x.source!=='unknown'?`<div>📥 ${sourceLabels[x.source]||x.source}</div>`:''}${x.contact_method?`<div>📞 ${contactMethodLabels[x.contact_method]||x.contact_method}</div>`:''}</div><div class="two" style="margin-top:10px"><button class="btn btn-secondary" onclick="editRequest(${x.id})">Изменить</button><button class="btn btn-danger" onclick="removeRequest(${x.id})">Удалить</button></div></div>`).join(''):'<div class="empty">На этот день заявок нет.</div>'}
function filtered(){const q=$('search').value.trim().toLowerCase(),st=$('statusFilter').value,as=$('assigneeFilter').value,day=$('dateFilter').value||S.selected,src=$('sourceFilter').value,cm=$('contactMethodFilter').value;return S.items.filter(x=>{const text=[x.client,x.address,x.phone,x.comment,x.assignee_name].join(' ').toLowerCase();return(!q||text.includes(q))&&(st==='all'||x.status===st)&&(as==='all'||x.assignee===as)&&(!day||dateKey(x.visit_date)===day)&&(src==='all'||x.source===src)&&(cm==='all'||x.contact_method===cm)}).sort((a,b)=>a.visit_date.localeCompare(b.visit_date))}
function renderRequests(){$('dateTitle').textContent='Заявки на '+labelDate($('dateFilter').value||S.selected);const rows=filtered();$('requests').innerHTML=rows.length?rows.map(x=>`<article class="request"><div class="row"><div><div class="name">${esc(x.client)}</div><div class="muted">${dt(x.visit_date)}</div></div><span class="badge s-${x.status}">${statuses[x.status]}</span></div><div class="meta"><div>📍 ${esc(x.address)}</div><div>📞 <a href="tel:${esc(x.phone)}">${esc(x.phone)}</a></div><div>👤 ${esc(x.assignee_name||x.assignee)}</div><div>💰 ${money(x.price)}</div>${x.source&&x.source!=='unknown'?`<div>📥 ${sourceLabels[x.source]||x.source}</div>`:''}${x.contact_method?`<div>📞 ${contactMethodLabels[x.contact_method]||x.contact_method}</div>`:''}${x.comment?`<div>📝 ${esc(x.comment)}</div>`:''}</div><div class="two"><button class="btn btn-secondary" onclick="editRequest(${x.id})">Изменить</button><button class="btn btn-danger" onclick="removeRequest(${x.id})">Удалить</button></div></article>`).join(''):'<div class="empty">На выбранный день заявок нет.</div>'}
function switchView(v){S.view=v;document.querySelectorAll('.view-switch .btn').forEach(b=>b.classList.toggle('active',b.dataset.view===v));$('monthView').classList.toggle('hidden',v!=='month');$('weekView').classList.toggle('hidden',v!=='week');$('dayView').classList.toggle('hidden',v!=='day');if(v==='week')renderWeek();if(v==='day')renderDay()}
async function load(){S.users=await api('/api/users');renderUsersOptions();S.items=await api('/api/requests');renderStats();renderCalendar();renderRequests()}
async function login(){S.auth={user:$('loginUser').value.trim(),pass:$('loginPass').value};const me=await api('/api/me');S.me=me;if($('rememberMe').checked)localStorage.setItem('master_crm_auth',JSON.stringify(S.auth));else localStorage.removeItem('master_crm_auth');$('sessionPill').textContent='Вошёл: '+S.me.name;$('adminBtn').classList.toggle('hidden',S.me.role!=='admin');$('auditBtn').classList.toggle('hidden',!['admin','manager'].includes(S.me.role));if(me.theme)setTheme(me.theme);else setTheme(document.documentElement.dataset.theme||'light');$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');await load();clearRequest()}
function logout(show=true){S.auth=null;S.me=null;localStorage.removeItem('master_crm_auth');$('appView').classList.add('hidden');$('loginView').classList.remove('hidden');if(show)alert('Вы вышли из системы')}
function clearRequest(){$('requestForm').reset();$('requestId').value='';$('requestFormTitle').textContent='Новая заявка';$('requestStatus').value='new';$('price').value='0';$('source').value='avito';$('contactMethod').value='';const d=new Date(S.selected+'T10:00:00');$('visitDate').value=d.toISOString().slice(0,16);if(S.auth)$('assignee').value=S.auth.user}
function newRequest(){clearRequest();openModal('requestModal')}
function editRequest(id){const x=S.items.find(i=>i.id===id);if(!x)return;$('requestFormTitle').textContent='Редактирование заявки';$('requestId').value=x.id;$('client').value=x.client;$('visitDate').value=x.visit_date.slice(0,16);$('address').value=x.address;$('phone').value=x.phone;$('requestStatus').value=x.status;$('price').value=x.price;$('assignee').value=x.assignee;$('comment').value=x.comment||'';$('source').value=x.source||'unknown';$('contactMethod').value=x.contact_method||'';openModal('requestModal')}
async function removeRequest(id){if(!confirm('Удалить заявку?'))return;try{await api('/api/requests/'+id,{method:'DELETE'});await load();if(S.view==='week')renderWeek();if(S.view==='day')renderDay()}catch(e){alert(e.message)}}
async function saveRequest(e){e.preventDefault();const p={client:$('client').value.trim(),visit_date:$('visitDate').value,address:$('address').value.trim(),phone:$('phone').value.trim(),status:$('requestStatus').value,price:Number($('price').value||0),comment:$('comment').value.trim(),assignee:$('assignee').value,source:$('source').value,contact_method:$('contactMethod').value};try{const id=$('requestId').value;await api(id?'/api/requests/'+id:'/api/requests',{method:id?'PUT':'POST',body:JSON.stringify(p)});S.selected=p.visit_date.slice(0,10);$('dateFilter').value=S.selected;closeModal('requestModal');await load();if(S.view==='week')renderWeek();if(S.view==='day')renderDay()}catch(e){alert('Не удалось сохранить: '+e.message)}}
function openUsers(){renderUsers();openModal('usersModal')}
function renderUsers(){$('usersList').innerHTML=S.users.map(u=>`<div class="user"><div><b>${esc(u.name)}</b><br><small>${esc(u.id)} · ${roleLabels[u.role]||u.role}</small></div><button class="btn btn-secondary" onclick="editUser('${esc(u.id)}')">Изменить</button></div>`).join('')}
function newUser(){$('userForm').reset();$('editUserId').value='';$('newUserId').disabled=false;$('newUserPassword').required=true;$('passwordLabel').textContent='Пароль';$('userFormTitle').textContent='Новый пользователь';$('deleteUserBtn').classList.add('hidden');openModal('userModal')}
function editUser(id){const u=S.users.find(x=>x.id===id);if(!u)return;$('editUserId').value=u.id;$('newUserId').value=u.id;$('newUserId').disabled=true;$('newUserName').value=u.name;$('newUserPassword').value='';$('newUserPassword').required=false;$('passwordLabel').textContent='Новый пароль (оставь пустым, чтобы не менять)';$('newUserRole').value=u.role;$('userFormTitle').textContent='Редактирование пользователя';$('deleteUserBtn').classList.toggle('hidden',u.id===S.me.id);openModal('userModal')}
async function saveUser(e){e.preventDefault();const old=$('editUserId').value,p={id:$('newUserId').value.trim(),name:$('newUserName').value.trim(),password:$('newUserPassword').value,role:$('newUserRole').value};if(old&&!p.password)delete p.password;try{await api(old?'/api/users/'+old:'/api/users',{method:old?'PUT':'POST',body:JSON.stringify(p)});await load();renderUsers();closeModal('userModal')}catch(e){alert('Не удалось сохранить: '+e.message)}}
async function removeUser(){const id=$('editUserId').value;if(!id||!confirm('Удалить пользователя '+id+'?'))return;try{await api('/api/users/'+id,{method:'DELETE'});await load();renderUsers();closeModal('userModal')}catch(e){alert('Не удалось удалить: '+e.message)}}
async function openReport(){const today=new Date().toISOString().slice(0,10);const start=new Date();start.setDate(1);$('reportDateFrom').value=start.toISOString().slice(0,10);$('reportDateTo').value=today;$('reportSummary').innerHTML='';$('reportTable').classList.add('hidden');openModal('reportModal')}
async function loadReport(){const from=$('reportDateFrom').value,to=$('reportDateTo').value;if(!from||!to){alert('Выбери даты периода');return}try{const data=await api(`/api/report?date_from=${from}&date_to=${to}`);$('reportSummary').innerHTML=`<div><b>Период:</b> ${from} – ${to}</div><div><b>Всего заявок:</b> ${data.total}</div><div><b>Активные:</b> ${data.active}</div><div><b>Завершённые:</b> ${data.completed}</div><div><b>Отменённые:</b> ${data.cancelled}</div><div><b>Выручка:</b> ${money(data.revenue)}</div>`;const tb=$('reportTable').querySelector('tbody');tb.innerHTML=Object.entries(data.by_source).map(([k,v])=>`<tr><td>${v.label}</td><td class="num">${v.total}</td><td class="num">${v.completed}</td><td class="num">${money(v.revenue)}</td></tr>`).join('');$('reportTable').classList.remove('hidden')}catch(e){alert('Не удалось загрузить отчёт: '+e.message)}}
async function openAnalytics(){try{const data=await api('/api/analytics/summary');let html=`<div style="display:grid;gap:16px"><div><b>Общая статистика</b><div class="meta"><div>Всего заявок: <b>${data.total}</b></div><div>Активные: <b>${data.active}</b></div><div>Завершённые: <b>${data.completed}</b></div><div>Выручка: <b>${money(data.revenue)}</b></div></div></div><div><b>По статусам</b><div class="meta">${Object.entries(data.by_status).map(([k,v])=>`<div>${statuses[k]||k}: <b>${v.count}</b> (${money(v.revenue)})</div>`).join('')}</div></div><div><b>По источникам</b><div class="meta">${Object.entries(data.by_source).map(([k,v])=>`<div>${sourceLabels[k]||k}: <b>${v.count}</b> (${money(v.revenue)})</div>`).join('')}</div></div>`;if(data.masters_ranking&&data.masters_ranking.length>0){html+=`<div><b>Рейтинг мастеров</b><div class="meta">${data.masters_ranking.map((m,i)=>`<div>${i+1}. ${esc(m.name)}: <b>${m.count}</b> заявок (${money(m.revenue)})</div>`).join('')}</div></div>`}html+=`<div><b>Топ клиентов</b><div class="meta">${data.top_clients.map((c,i)=>`<div>${i+1}. ${esc(c.client)}: <b>${c.count}</b> заявок (${money(c.revenue)})</div>`).join('')}</div></div></div>`;$('analyticsContent').innerHTML=html;openModal('analyticsModal')}catch(e){alert('Не удалось загрузить аналитику: '+e.message)}}
async function openClients(){try{const clients=await api('/api/clients');const recent=clients.slice(0,3);$('clientsList').innerHTML=recent.length?recent.map(c=>`<div class="client-item" onclick="openClientDetail('${esc(c.client).replace(/'/g,"\\'")}')"><b>${esc(c.client)}</b><small>${c.count} заявок · ${money(c.revenue)} · Последняя: ${dt(c.last_visit)}</small></div>`).join(''):'<div class="empty">Клиентов пока нет</div>';$('showAllClientsBtn').onclick=()=>{openAllClients(clients)};openModal('clientsModal')}catch(e){alert('Не удалось загрузить клиентов: '+e.message)}}
function openAllClients(clients){const html=clients.map(c=>`<div class="client-item" onclick="openClientDetail('${esc(c.client).replace(/'/g,"\\'")}')"><b>${esc(c.client)}</b><small>${c.count} заявок · ${money(c.revenue)} · Последняя: ${dt(c.last_visit)}</small></div>`).join('');$('clientsList').innerHTML=html}
async function openClientDetail(name){try{const data=await api('/api/clients/'+encodeURIComponent(name));$('clientDetailName').textContent=data.client;$('clientDetailStats').innerHTML=`<div><b>Всего заявок:</b> ${data.total}</div><div><b>Выручка:</b> ${money(data.revenue)}</div>`;$('clientDetailRequests').innerHTML=data.requests.length?data.requests.map(r=>`<article class="request"><div class="row"><div><div class="name">${esc(r.client)}</div><div class="muted">${dt(r.visit_date)}</div></div><span class="badge s-${r.status}">${statuses[r.status]}</span></div><div class="meta"><div>📍 ${esc(r.address)}</div><div>📞 <a href="tel:${esc(r.phone)}">${esc(r.phone)}</a></div><div>👤 ${esc(r.assignee_name||r.assignee)}</div><div>💰 ${money(r.price)}</div></div></article>`).join(''):'<div class="empty">Заявок нет</div>';openModal('clientDetailModal')}catch(e){alert('Не удалось загрузить клиента: '+e.message)}}
async function exportClients(){try{const data=await api('/api/clients/export');const blob=new Blob([data.csv],{type:'text/csv'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='clients.csv';a.click();URL.revokeObjectURL(url)}catch(e){alert('Не удалось экспортировать: '+e.message)}}
async function openAudit(){if(!['admin','manager'].includes(S.me.role)){alert('Доступ только для администратора и менеджера');return}try{const logs=await api('/api/audit');$('auditList').innerHTML=logs.length?logs.map(l=>`<article class="request"><div class="row"><div><div class="name">${esc(l.user_name||l.user_id)}</div><div class="muted">${dt(l.created_at)}</div></div><span class="badge" style="background:var(--primary-soft)">${esc(l.action)}</span></div><div class="meta"><div><b>Сущность:</b> ${esc(l.entity_type)} ${l.entity_id?`#${l.entity_id}`:''}</div>${l.old_values?`<div><b>Было:</b> <code style="font-size:12px">${esc(JSON.stringify(JSON.parse(l.old_values)).slice(0,200))}</code></div>`:''}${l.new_values?`<div><b>Стало:</b> <code style="font-size:12px">${esc(JSON.stringify(JSON.parse(l.new_values)).slice(0,200))}</code></div>`:''}</div></article>`).join(''):'<div class="empty">Записей нет</div>';openModal('auditModal')}catch(e){alert('Не удалось загрузить аудит: '+e.message)}}
$('loginBtn').onclick=()=>login().catch(e=>alert(e.message||'Неверный логин или пароль'));$('loginPass').addEventListener('keydown',e=>{if(e.key==='Enter')login().catch(x=>alert(x.message))});$('logoutBtn').onclick=()=>logout();$('themeBtn').onclick=toggleTheme;$('adminBtn').onclick=openUsers;$('auditBtn').onclick=openAudit;$('clientsBtn').onclick=openClients;$('showAllClientsBtn').onclick=()=>{};$('exportClientsBtn').onclick=exportClients;$('analyticsBtn').onclick=openAnalytics;$('reportBtn').onclick=openReport;$('loadReportBtn').onclick=loadReport;$('prevMonth').onclick=()=>{S.month=new Date(S.month.getFullYear(),S.month.getMonth()-1,1);renderCalendar()};$('nextMonth').onclick=()=>{S.month=new Date(S.month.getFullYear(),S.month.getMonth()+1,1);renderCalendar()};$('prevWeek').onclick=()=>{S.selected=new Date(new Date(S.selected).setDate(new Date(S.selected).getDate()-7));S.month=new Date(S.selected);renderWeek()};$('nextWeek').onclick=()=>{S.selected=new Date(new Date(S.selected).setDate(new Date(S.selected).getDate()+7));S.month=new Date(S.selected);renderWeek()};$('prevDay').onclick=()=>{S.selected=new Date(new Date(S.selected).setDate(new Date(S.selected).getDate()-1));S.month=new Date(S.selected);renderDay()};$('nextDay').onclick=()=>{S.selected=new Date(new Date(S.selected).setDate(new Date(S.selected).getDate()+1));S.month=new Date(S.selected);renderDay()};$('dateFilter').value=S.selected;$('dateFilter').onchange=()=>{S.selected=$('dateFilter').value;S.month=new Date(S.selected);renderCalendar();renderRequests();if(S.view==='week')renderWeek();if(S.view==='day')renderDay()};['search','statusFilter','assigneeFilter','sourceFilter','contactMethodFilter'].forEach(id=>$(id).addEventListener('input',renderRequests));document.querySelectorAll('.view-switch .btn').forEach(b=>b.onclick=()=>switchView(b.dataset.view));$('newRequestFab').onclick=newRequest;$('newRequestTop').onclick=newRequest;if($('newRequestSide'))$('newRequestSide').onclick=newRequest;$('clearRequest').onclick=clearRequest;$('requestForm').onsubmit=saveRequest;$('newUserBtn').onclick=newUser;$('userForm').onsubmit=saveUser;$('deleteUserBtn').onclick=removeUser;document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeModal(b.dataset.close));document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)closeModal(m.id)}));document.documentElement.dataset.theme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';$('themeBtn').textContent=document.documentElement.dataset.theme==='dark'?'☀️':'🌙';try{const saved=JSON.parse(localStorage.getItem('master_crm_auth'));if(saved?.user&&saved?.pass){$('loginUser').value=saved.user;$('loginPass').value=saved.pass;$('rememberMe').checked=true;setTimeout(()=>login().catch(()=>localStorage.removeItem('master_crm_auth')),100)}}catch(e){}
</script>
